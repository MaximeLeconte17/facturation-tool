<p-table [value]="datas()" >
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Adresse</th>
    </tr>
  </ng-template>

  <ng-template #body let-data>
    <tr>
      <td>{{ data.nom }}</td>
      <td>{{ data.email }}</td>
      <td>{{ data.adresse }}</td>
<td class="btn-container">
  <p-button
    icon="pi pi-trash"
    severity="danger"
    [text]="true"
    [rounded]="true"
    size="small"
    (onClick)="remove.emit(data.id)"
    ariaLabel="Supprimer"
  />
  <p-button
    icon="pi pi-arrow-right"
    [rounded]="true"
    size="small"
    (onClick)="open.emit(data.id)"
    ariaLabel="Naviguer"
  />
</td>    </tr>
  </ng-template>
</p-table>
