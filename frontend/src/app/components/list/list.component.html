<p-table [value]="datas()" >
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Adresse</th>
    </tr>
  </ng-template>

  <ng-template #body let-data>
    <tr>
      <td>{{ data.nom }}</td>
      <td>{{ data.email }}</td>
      <td>{{ data.adresse }}</td>
      <td> <button type="button" (click)="remove.emit(data.id)" title="remove" class="delete-button" > <i class="pi pi-trash"></i> </button> </td>
    </tr>
  </ng-template>
</p-table>
